name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compile, unit tests, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compiles, runs every JUnit unit test (no MongoDB needed) and builds the jar.
      # The step - and therefore the workflow - fails if compilation or any test fails.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Publish test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("target/surefire-reports/TEST-*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print("### Unit test results")
          print(f"- Tests run: **{t}**")
          print(f"- Failures: **{f}**, errors: **{e}**, skipped: **{s}**")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: polling-voting-system-jar
          path: target/polling-voting-system.jar

  integration-tests:
    name: MongoDB integration tests
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests tagged "integration"
        run: mvn -B -ntp verify -Pintegration

  functional-tests:
    name: Postman/Newman API tests
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_DATABASE: polling_voting_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build jar
        run: mvn -B -ntp package -DskipTests
      - name: Start the application
        run: |
          nohup java -jar target/polling-voting-system.jar > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then echo "app is up"; exit 0; fi
            sleep 2
          done
          echo "application did not become healthy"; cat app.log; exit 1
      - name: Run Postman collection with Newman
        run: |
          npx --yes newman run tests/postman/Online-Polling-System.postman_collection.json \
            --reporters cli,junit --reporter-junit-export newman-results.xml
      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: |
            newman-results.xml
            app.log
